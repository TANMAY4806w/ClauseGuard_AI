name: ClauseGuard 24/7 Keep-Alive Uptime Engine

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Backend & Supabase DB
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Health Endpoint
        env:
          APP_URL: ${{ secrets.BACKEND_URL || secrets.RENDER_URL || secrets.HF_SPACE_HOST }}
        run: |
          TARGET="${APP_URL:-https://clauseguard-ai-backend-an5b.onrender.com}"
          # If target does not start with http, prepend https://
          if [[ "$TARGET" != http* ]]; then
            TARGET="https://${TARGET}"
          fi
          # Ensure health endpoint suffix
          if [[ "$TARGET" != */health ]]; then
            TARGET="${TARGET%/}/health"
          fi
          
          echo "Sending automated keep-alive ping to $TARGET..."
          
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" "$TARGET" || echo "000")
          echo "HTTP Status Code: $HTTP_RESPONSE"
          
          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 400 ]; then
            echo "Success: Backend and Supabase DB kept active."
            cat response.json
          else
            echo "Warning: Endpoint returned $HTTP_RESPONSE. Attempting fallback wake-up..."
            curl -s "$TARGET" || true
          fi
