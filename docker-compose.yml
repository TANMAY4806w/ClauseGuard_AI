version: '3.8'

services:
  # 1. ClauseGuard AI FastAPI Microservice
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clauseguard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ClauseGuard AI
      - APP_ENV=production
      - DEBUG=False
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-prod_super_secret_clauseguard_jwt_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_LLM_MODEL=gemini-1.5-flash
      # Connect to external Qdrant container
      - QDRANT_MODE=server
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Connect to external Redis container
      - REDIS_MODE=server
      - REDIS_URL=redis://redis:6379/0
      - MAX_UPLOAD_SIZE_MB=25
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - contract_uploads:/app/data/raw_uploads
    networks:
      - clauseguard-network

  # 2. Qdrant Distributed Hybrid Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: clauseguard_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clauseguard-network

  # 3. Redis In-Memory Cache & State Store
  redis:
    image: redis:7-alpine
    container_name: clauseguard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clauseguard-network

networks:
  clauseguard-network:
    driver: bridge

volumes:
  qdrant_storage:
    name: clauseguard_qdrant_storage
  redis_data:
    name: clauseguard_redis_data
  contract_uploads:
    name: clauseguard_contract_uploads
