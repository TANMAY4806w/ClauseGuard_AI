name: ClauseGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Run Full Test Suite (32 Tests)
        run: |
          python -m pytest tests/ -v --durations=10

  frontend:
    name: Frontend Typecheck & Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build Bundle
        working-directory: frontend
        run: npm run build

  evaluate:
    name: Legal Benchmark Quality Gates (Ragas & LLM)
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Execute 35-Case Ragas Benchmark
        run: |
          python evaluation/run_ragas_eval.py

      - name: Execute LLM Statutory Quality Benchmark
        run: |
          python evaluation/run_llm_eval.py
