name: ClauseGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Run Full Test Suite (24 Tests)
        run: |
          python -m pytest tests/ -v --durations=10

  evaluate:
    name: Ragas Benchmark Quality Gates
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Execute 35-Case Ragas Benchmark
        run: |
          python evaluation/run_ragas_eval.py
