name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO != ''
        run: |
          echo "Configuring Hugging Face remote for $HF_SPACE_REPO..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add space "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO"
          git push space main:main --force
